[package]
name = "roweb-client"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytemuck = "1"
console_error_panic_hook = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
js-sys = "0.3"
# A Lua interpreter in Rust, for the scripts of a homunculus and a mercenary (`src/ai.rs`).
lunita = "0.1.2"
miniz_oxide = "0.8"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["AddEventListenerOptions", "BinaryType", "Blob", "CanvasRenderingContext2d", "CloseEvent", "CssStyleDeclaration", "DataTransfer", "DragEvent", "Document", "DomRect", "Element", "Event", "EventTarget", "File", "FileList", "Headers", "History", "HtmlAudioElement", "HtmlCanvasElement", "HtmlElement", "HtmlImageElement", "HtmlInputElement", "HtmlMediaElement", "HtmlSelectElement", "ImageData", "KeyboardEvent", "Location", "MessageEvent", "MouseEvent", "NodeList", "Performance", "RequestInit", "Response", "Storage", "TextDecoder", "UrlSearchParams", "WebSocket", "WheelEvent", "Window", "console"] }
wgpu = { version = "29", default-features = false, features = ["std", "webgpu", "webgl", "wgsl"] }
