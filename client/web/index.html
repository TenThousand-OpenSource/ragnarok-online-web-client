<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ragnarok 2026</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  /* The name of whoever the pointer is on, over their head. */
  /* The sign of the map come into (the client's `MapNameDisplay`): across the view, a fifth of it high and 12
     hundredths down; its picture as high as it, in the middle; the small line and the large one in white, at the
     picture's own measure (190 high: 16 at 72, and 44 at 95). It stays five seconds and fades over a quarter. */
  #mapsign { position: fixed; left: 0; top: 12vh; width: 100%; height: 20vh; display: none; pointer-events: none; z-index: 5; text-align: center;
             color: #fff; font-family: Gulim, Tahoma, Arial, sans-serif; font-weight: bold; }
  #mapsign.shown { display: block; animation: mapsign 5.255s linear forwards; }
  #mapsign img { height: 100%; }
  #mapsign .over { position: absolute; left: 0; width: 100%; top: 7.58vh; font-size: 1.68vh; line-height: 1; }
  #mapsign .title { position: absolute; left: 0; width: 100%; top: 10vh; font-size: 4.63vh; line-height: 1; }
  @keyframes mapsign { 0%, 95.15% { opacity: 1; } 100% { opacity: 0; } }
  /* The skill being aimed and its level, by the pointer. */
  #aim { position: fixed; display: none; padding: 1px 4px; white-space: nowrap; pointer-events: none; z-index: 5;
         font: 12px Gulim, Tahoma, Arial, sans-serif; color: #fff; text-shadow: 1px 1px 0 #000, -1px 0 0 #000, 0 -1px 0 #000; }
  #tip { position: fixed; display: none; z-index: 30; padding: 2px 4px; background: rgba(0, 0, 0, .53); color: #fff; white-space: nowrap; pointer-events: none; font-family: Arial, sans-serif; }
  #unit-name { position: fixed; display: none; transform: translateX(-50%); padding: 4px; white-space: nowrap; pointer-events: none;
               font: 12px Gulim, Tahoma, Arial, sans-serif; color: #fff; z-index: 5;
               text-shadow: -1px 0 #000, 1px 0 #000, 0 -1px #000, 0 1px #000, -1px -1px #000, 1px 1px #000, -1px 1px #000, 1px -1px #000; }
  .dim { opacity: .4; }
  /* The dark that covers the screen while the character is moved elsewhere. */
  #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 8; }
  /* The client's loading screen (UILoadingWnd): its picture over the whole screen, and a bar of 240 by 15
     standing 100 left of the middle and 160 under it, as large as the windows are drawn. */
  #loading { position: fixed; inset: 0; display: none; background: #000 center / 100% 100% no-repeat; z-index: 9; }
  #loading-bar { position: absolute; left: 50%; top: 50%; width: 240px; height: 15px; box-sizing: border-box; border: 1px solid #00ffff;
                 background: #8e8e8e; transform-origin: 0 0; transform: scale(var(--s, 1)) translate(-100px, 160px); }
  #loading-fill { display: block; width: 0; height: 13px; background: #2a4b8f; }
  #loading-figure { position: absolute; left: 100px; top: -1px; font: bold 13px Gulim, Tahoma, Arial, sans-serif; line-height: 15px; color: #ffff00; white-space: pre; }
  /* The key that uses a slot of the bar, in its corner. */
  .key { position: absolute; left: 1px; top: -1px; font: 9px Tahoma, Arial, sans-serif; color: #5a6aa8; pointer-events: none; }
  /* The life of a monster being fought, under it: green on dark, in a blue frame, as the original's. */
  #bars { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 4; }
  .life { position: fixed; width: 58px; height: 3px; background: #424242; border: 1px solid #10189c; }
  .life i { display: block; height: 3px; background: #10ef21; }
  /* The bar of a cast (UIRechargeGage): its colours are the client's. */
  .cast { position: fixed; width: 60px; height: 6px; box-sizing: border-box; background: #444444; border: 1px solid #14199b; pointer-events: none; }
  .cast i { display: block; height: 4px; background: #16ea25; }
  .life.own { height: 7px; }
  .life.own i.low { background: #ff0000; }
  .life.own i.sp { margin-top: 1px; background: #205cc3; }
  /* What someone says, over their head: white on a dark plate, as the original's. */
  .say { position: fixed; transform: translate(-50%, -100%); max-width: 220px; padding: 2px 6px; pointer-events: none; text-align: center;
         font: 12px Gulim, Tahoma, Arial, sans-serif; color: #fff; background: rgba(0, 0, 0, .55); border-radius: 2px; overflow-wrap: break-word; }
  /* The storage's tabs: names written up the side. */
  .side { padding: 0; border: 1px solid #b9bfdc; border-right: 0; border-radius: 4px 0 0 4px; background: #e9ecf7; cursor: pointer; }
  .side.open { background: #fff; font-weight: bold; }
  .side i { display: block; font: 10px Tahoma, Arial, sans-serif; font-style: normal; color: #313131; transform: rotate(-90deg); white-space: nowrap; }
  .row { outline: 0; color: #000; }
  .row:focus { background: #5b9bf0; color: #fff; }
  .opt:hover { background: #c6d6f7; }
  /* The number of a hit, rising from the one hit: white on others, red on the player's own character. */
  .hit { position: fixed; transform: translateX(-50%); pointer-events: none; z-index: 5; font: bold 16px Arial, sans-serif; color: #fff;
         text-shadow: -1px 0 #000, 1px 0 #000, 0 -1px #000, 0 1px #000; animation: hit .9s ease-out forwards; }
  .hit.own { color: #ff2a2a; }
  /* The number starts large over the one struck and flies up and aside, shrinking as it goes, as the original's. */
  @keyframes hit { 0% { transform: translate(-50%, 0) scale(1.7); opacity: 1; } 70% { opacity: 1; }
                   100% { transform: translate(calc(-50% + var(--sway, 0px)), -80px) scale(.55); opacity: 0; } }
  /* What was picked up, told for a moment. */
  .note { animation: note 5s linear forwards; }
  #obtained { text-align: center; }
  @keyframes note { 0%, 96% { opacity: 1; } 100% { opacity: 0; } }
  /* The game's own pointers over the page, once they are read: the plain one, and the pressing one on what can be pressed. */
  html, body, #ui { cursor: var(--point, auto); }
  #ui button, #ui .b, #ui [data-click], #ui [data-use] { cursor: var(--press, pointer); }
  canvas#game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: none; }
  #ui { position: fixed; inset: 0; overflow: hidden; background: #000 center / cover no-repeat;
        font: 12px/1.25 Tahoma, Arial, sans-serif; color: #000; user-select: none; }
  #ui * { box-sizing: border-box; }
  /* In the game the world shows through, and takes the mouse wherever no window is. */
  /* The windows lie over what is drawn in the world: the bars (4), names and numbers (5); the fade (8) and the
     loading screen (9) lie over the windows. */
  #ui.ingame { background: none !important; pointer-events: none; z-index: 6; }
  #ui.ingame .hud, #ui.ingame .lang, #ui.ingame .minimap, #ui.ingame .w, #ui.ingame .veil, #ui.ingame #narrow { pointer-events: auto; }
  #narrow { position: absolute; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px;
            background: rgba(20, 28, 66, .94); }
  #narrow p { max-width: 320px; margin: 0; font-size: 15px; line-height: 1.5; color: #fff; text-align: center; }
  .stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }

  /* The server's name over the login picture, and the language switch. */
  .title { position: absolute; top: 5%; left: 0; right: 0; text-align: center; font: bold 44px Georgia, "Times New Roman", serif;
           color: #fff; letter-spacing: 1px; pointer-events: none;
           text-shadow: 0 0 6px #2b3f8f, 0 0 14px #2b3f8f, 2px 2px 0 #1c2a66, -1px -1px 0 #1c2a66, 1px -1px 0 #1c2a66, -1px 1px 0 #1c2a66; }
  .lang { position: absolute; top: 8px; right: 8px; display: flex; gap: 2px; z-index: 30; }
  .lang button { padding: 2px 7px; font: bold 11px Tahoma, Arial, sans-serif; color: #33406e; background: rgba(255, 255, 255, .8);
                 border: 1px solid #7f93b8; border-radius: 3px; cursor: pointer; }
  .lang button.on { color: #fff; background: #5a6b9c; }
  .lang button svg { display: block; }
  .lang button:first-of-type { padding: 2px 5px; margin-right: 4px; }
  .lang .hint { align-self: center; margin-right: 6px; padding: 2px 8px; font-size: 11px; color: #fff; background: rgba(43, 63, 143, .8);
                border-radius: 9px; white-space: nowrap; pointer-events: none; }

  /* A window of the original client: a fixed size in pixels, its parts placed by coordinates. */
  .w { position: absolute; transform-origin: 0 0; background: no-repeat 0 0; z-index: 10; }
  .w.top { z-index: 25; }
  .w form { margin: 0; }
  .a { position: absolute; margin: 0; }
  .pass { pointer-events: none; }
  .veil { position: absolute; inset: 0; z-index: 20; }
  .b { padding: 0; border: 0; background: var(--n) no-repeat 0 0; font: 12px Tahoma, Arial, sans-serif; color: #313131;
       cursor: pointer; white-space: nowrap; overflow: hidden; }
  .b:hover { background-image: var(--o); }
  .b:active { background-image: var(--p); }
  .b:disabled { color: #909090; cursor: default; background-image: var(--n); }
  .b img { display: block; pointer-events: none; }
  .b[data-big] { font-size: 14px; font-weight: bold; }
  .check { padding: 0; border: 0; background: no-repeat 0 0; cursor: pointer; }
  .in { padding: 0 3px; border: 0; outline: 0; background: transparent; font: 12px Tahoma, Arial, sans-serif; color: #000; user-select: text; }
  .in.centre { text-align: center; }
  .in::placeholder { color: #9c9c9c; }
  .combo { padding: 0 5px; line-height: 22px; }
  .small { font-size: 11px; }
  .centre { text-align: center; }
  .w p.a.tight { line-height: 14px; }
  .in.boxed { background: #fff; border: 1px solid #9c9c9c; }
  .w p.a { line-height: 16px; }

  /* Character select. */
  .name { font-size: 11px; font-weight: bold; color: #374177; text-align: center; white-space: nowrap; overflow: hidden; }
  .value { line-height: 15px; white-space: nowrap; overflow: hidden; }
  .list-title { color: #576691; text-align: center; }
  .page { font: bold 18px Tahoma, Arial, sans-serif; color: #fff; text-align: center; }
  .start { font: bold 18px Tahoma, Arial, sans-serif; color: #fff; padding-top: 34px; }
  .start:disabled { color: #dc747f; }
  .chosen { pointer-events: none; }
  .chosen i { position: absolute; inset: 0; opacity: 0; background-repeat: no-repeat; animation: chosen .664s steps(1) infinite; }
  .chosen i:nth-child(2) { animation-delay: 83ms; } .chosen i:nth-child(3) { animation-delay: 166ms; } .chosen i:nth-child(4) { animation-delay: 249ms; }
  .chosen i:nth-child(5) { animation-delay: 332ms; } .chosen i:nth-child(6) { animation-delay: 415ms; } .chosen i:nth-child(7) { animation-delay: 498ms; }
  .chosen i:nth-child(8) { animation-delay: 581ms; }
  @keyframes chosen { 0% { opacity: 1; } 12.5% { opacity: 0; } 100% { opacity: 0; } }

  /* Character creation. */
  .race { padding: 0; border: 0; background: no-repeat 0 0; font: inherit; text-align: left; cursor: pointer; }
  .race b { position: absolute; left: 45px; top: 20px; color: #fff; }
  .race p { position: absolute; left: 110px; top: 20px; width: 230px; margin: 0; line-height: 15px; color: #555; max-height: 60px; overflow: hidden; }

  /* The forms the original client does not have, in the look of its newer windows. */
  .panel { background: linear-gradient(135deg, #dfe4fb, #fff 30%, #fff 70%, #fbe1ea); border: 1px solid #8d93b5; border-radius: 9px;
           box-shadow: 0 1px 4px rgba(40, 50, 110, .45); }
  .panel h1 { margin: 9px 14px 6px; font: bold 12px Tahoma, Arial, sans-serif; color: #576691; }
  .panel .rows { margin: 0 14px; }
  .panel .rows p { margin: 0 0 6px; font-size: 11px; line-height: 14px; color: #555; }
  .panel label { display: grid; grid-template-columns: 76px 1fr; align-items: center; margin-bottom: 5px; color: #333; }
  .panel input, .panel select { min-width: 0; height: 20px; padding: 0 5px; font: 12px Tahoma, Arial, sans-serif; color: #000;
                                background: #fff; border: 1px solid #b9bfdc; border-radius: 9px; outline: 0; user-select: text; }
  .panel input:focus, .panel select:focus { border-color: #7f8fd0; }

  /* The game's own windows. */
  .hud { z-index: 10; }
  .t { white-space: nowrap; line-height: 13px; }
  .t.titled { color: #000; text-shadow: 1px 1px 0 #fff; }
  #chat { z-index: 9; }
  /* Items, skills, and the slots they are dragged to. */
  .scroll { overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
  /* A text field that scrolls with its bar in sight (the client's UITextViewer). */
  .viewer { overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; scrollbar-color: #b9bfdc #f4f5fb; }
  .scroll::-webkit-scrollbar { display: none; }
  .cell, .slot { width: 32px; height: 32px; }
  .slot { width: 24px; height: 24px; cursor: pointer; }
  .slot:hover { background: rgba(130, 170, 230, .63); }
  .cell img { position: absolute; left: 4px; top: 4px; pointer-events: none; }
  .slot img { position: absolute; left: 0; top: 0; pointer-events: none; }
  .cell[draggable=true], .cell[data-use] { cursor: pointer; }
  .cell.worn { outline: 1px solid #e0a000; outline-offset: -2px; background: rgba(255, 220, 120, .35); }
  .n { position: absolute; right: 1px; bottom: 0; font-size: 11px; line-height: 11px; color: #000; pointer-events: none;
       text-shadow: 1px 0 0 #fff, -1px 0 0 #fff, 0 1px 0 #fff, 0 -1px 0 #fff; }
  .tab { padding: 4px 0 0; border: 1px solid #c3c3c3; background: #e8e8e8; font: 12px Tahoma, Arial, sans-serif; color: #000; cursor: pointer; }
  .tab.open { background: #fff; border-right-color: #fff; width: 18px !important; }
  .tab span { display: block; line-height: 13px; text-align: center; }
  #chat-log { padding: 0 2px; overflow-x: hidden; overflow-y: auto; display: flex; flex-direction: column-reverse; scrollbar-width: thin; scrollbar-color: #9aa3c8 transparent;
              color: #fff; font: 12px Gulim, Tahoma, Arial, sans-serif; user-select: text; }
  #chat-log div { line-height: 14px; white-space: nowrap; text-shadow: 1px 1px 0 #000; }
  .chat-tab { padding: 0; border: 0; color: #fff; font: 12px Gulim, Tahoma, Arial, sans-serif; line-height: 15px; text-align: center; white-space: nowrap; overflow: hidden; cursor: var(--press, pointer); }
  #chat-input { background: #f0f0f0; }
  /* How many play, by the chat's tabs: a green light that breathes, the number, and the word. */
  .online { display: flex; align-items: center; gap: 5px; padding: 0 8px 0 6px; border-radius: 8px; background: rgba(0, 0, 0, .45);
            font: 12px Gulim, Tahoma, Arial, sans-serif; color: #dfe; white-space: nowrap; pointer-events: auto; }
  .online i { width: 7px; height: 7px; border-radius: 50%; background: #5dff7a; box-shadow: 0 0 5px 1px #37e05a; animation: online 2.4s ease-in-out infinite; }
  .online b { font-weight: bold; color: #fff; text-shadow: 1px 1px 0 #000; }
  .online span { color: #b9f5c6; text-shadow: 1px 1px 0 #000; }
  @keyframes online { 0%, 100% { opacity: 1; box-shadow: 0 0 5px 1px #37e05a; } 50% { opacity: .55; box-shadow: 0 0 2px 0 #37e05a; } }
  /* Under the minimap, where the client's bar of it is: 145 from the right edge, the text 145 down. */
  .mapname { position: absolute; right: 17px; top: 145px; width: 128px; height: 14px; color: #fff; font-size: 12px; pointer-events: none; }
  .mapname span { position: absolute; left: 20px; top: 0; white-space: pre; text-shadow: -1px 0 0 #000; }
                border-radius: 9px; white-space: nowrap; pointer-events: none; }

  .w.top { z-index: 25; }
  .w form { margin: 0; }
  .a { position: absolute; margin: 0; }
  .pass { pointer-events: none; }
       cursor: pointer; white-space: nowrap; overflow: hidden; }
  .b:hover { background-image: var(--o); }
  .in.centre { text-align: center; }
  .in::placeholder { color: #9c9c9c; }
  .small { font-size: 11px; }
  .centre { text-align: center; }
  .w p.a.tight { line-height: 14px; }
  .w p.a { line-height: 16px; }

  /* Character select. */
  .start:disabled { color: #dc747f; }

  /* Character creation. */

           box-shadow: 0 1px 4px rgba(40, 50, 110, .45); }
  .panel .rows { margin: 0 14px; }
                                background: #fff; border: 1px solid #b9bfdc; border-radius: 9px; outline: 0; user-select: text; }

  /* The game's own windows. */
  .hud { z-index: 10; }
  #chat { z-index: 9; }
       text-shadow: 1px 0 0 #fff, -1px 0 0 #fff, 0 1px 0 #fff, 0 -1px 0 #fff; }
              display: flex; flex-direction: column; justify-content: flex-end; }
  #chat-input { background: #f0f0f0; }
  .lang button:first-of-type { }
  /* The minimap, in the corner where the original client has it. */
  /* 128 by 128, 144 from the right edge and 16 down (`CGameMode::DrawMiniMap`); the client draws the map's
     picture and nothing around it. */
  .minimap { position: absolute; right: 16px; top: 16px; width: 128px; height: 128px; }
  .minimap img { width: 100%; height: 100%; display: block; opacity: .9; }
  .minimap img.mark { position: absolute; width: auto; height: auto; opacity: 1; transform: translate(-50%, -50%); pointer-events: auto; }
  .minimap i { position: absolute; width: 6px; height: 6px; margin: -4px 0 0 -4px; background: #fff; border: 1px solid #000;
               border-radius: 50%; box-shadow: 0 0 4px 1px #ff0; }
</style>
<style id="frames"></style>
</head>
<body>
<canvas id="game"></canvas>
<div id="unit-name"></div>
<div id="tip"></div>
<div id="aim"></div>
<div id="mapsign"></div>
<div id="bars"></div>
<div id="fade"></div>
<div id="loading"><div id="loading-bar"><i id="loading-fill"></i><span id="loading-figure"></span></div></div>
<div id="ui"></div>
<script type="module">
  // The build's number goes into both addresses, so that a browser never runs an older build it kept.
  import init from "./roweb_client.js?v=__BUILD__";
  init({ module_or_path: "./roweb_client_bg.wasm?v=__BUILD__" }).catch((error) => { document.getElementById("ui").textContent = String(error); });
</script>
</body>
</html>
