[package]
name = "roweb-gateway"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
axum = { version = "0.8", features = ["ws"] }
encoding_rs = "0.8"
flate2 = "1"
futures-util = "0.3"
getrandom = "0.4.3"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["bmp", "tga", "png", "jpeg"] }
lettre = { version = "0.11.23", default-features = false, features = ["tokio1", "smtp-transport", "builder", "tokio1-rustls", "rustls-platform-verifier", "ring"] }
lunify = "1"
mlua = { version = "0.11", features = ["lua51", "vendored"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "mysql"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time"] }
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
serde_json = "1"
